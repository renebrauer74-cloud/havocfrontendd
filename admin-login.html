<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAVOC ADMIN | Login</title>
    <style>
        /* Modernes, cleanes CSS ohne externe Abhängigkeiten */
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Auswahlen (Markierungen) invertieren */
        ::selection {
            background-color: #ffffff;
            color: #000000;
        }

        /* Die Login-Box im Kingstar / HAVOC Stil */
        .login-box {
            border: 1px solid #27272a; /* Zink-800 */
            padding: 32px;
            width: 100%;
            max-width: 400px;
            background-color: #09090b; /* Zink-950 */
        }

        .logo-container {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-box {
            background-color: #ffffff;
            color: #000000;
            padding: 8px 24px;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: -0.05em;
            display: inline-block;
            text-transform: uppercase;
        }

        .logo-sub {
            font-size: 10px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-weight: 300;
            margin-top: 8px;
            color: #a1a1aa; /* Zink-400 */
        }

        /* Formular-Elemente */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 10px;
            letter-spacing: 0.15em;
            font-weight: 300;
            color: #a1a1aa;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background-color: #000000;
            border: 1px solid #27272a;
            padding: 12px;
            font-size: 14px;
            color: #ffffff;
            font-family: monospace;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: #ffffff;
        }

        button {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #e4e4e7; /* Zink-200 */
        }

        /* Fehlermeldung */
        .error-message {
            display: none;
            border: 1px solid #ef4444;
            color: #ef4444;
            font-size: 12px;
            padding: 12px;
            margin-bottom: 24px;
            background-color: rgba(69, 10, 10, 0.2);
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-container">
            <div class="logo-box">HAVOC</div>
            <div class="logo-sub">ADMIN LOGIN</div>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Passwort</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">ENTER BACKEND</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            try {
                const response = await fetch('https://havoc-backend-063h.onrender.com/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('havoc_token', data.token);
                    window.location.href = 'admin-dashboard.html';
                } else {
                    errorDiv.textContent = data.error || 'Login fehlgeschlagen.';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Verbindung zum Server fehlgeschlagen. Läuft dein Backend?';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
