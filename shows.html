<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAVOC AGENCY | SHOWS</title>
    <style>
        /* ==========================================================================
           1:1 DESIGN SYSTEM NACH BRAND-VORGABE (FULL-WIDTH HEADER)
           ========================================================================== */
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray: #757575;
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--white);
            color: var(--black);
            font-family: var(--font-main);
            padding: 40px; /* Äußerer Rahmen über die komplette Seite */
            letter-spacing: -0.02em;
        }

        /* --- HEADER ÜBER DIE KOMPLETTE BREITE (NICHT ZENTRIERT) --- */
header {
    display: flex;
    justify-content: space-between;
    align-items: center; 
    border-bottom: 1px solid #e0e0e0; 
    padding-bottom: 20px;
    margin-bottom: 60px;
    width: 100%; 
}

.logo-link {
    display: inline-block;
    text-decoration: none;
    line-height: 0;
    transition: opacity 0.2s ease;
}

.logo-link:hover {
    opacity: 0.8;
}

.logo-link img {
    height: 98px; /* Exakt 50% vergrößert für den brachialen Look */
    width: auto;
    display: block;
}

nav {
    display: flex;
    align-items: center;
    gap: 25px;
}

nav a {
    color: #000000;
    text-decoration: none;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    transition: opacity 0.2s ease;
}

nav a:hover {
    opacity: 0.5;
}

nav a.active {
    opacity: 0.4; /* Kennzeichnet die aktuell aktive Seite */
}

nav a.admin-btn {
    border: 1px solid #000000;
    padding: 6px 12px;
    margin-left: 5px;
}

        /* ==========================================================================
           ZENTRIERTER CONTENT WRAPPER (NUR FÜR INHALTE UNTERHALB DES HEADERS)
           ========================================================================== */
        .content-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        h1.page-title {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 60px;
            line-height: 0.9;
            width: 100%;
        }
        
        /* Editorial List-Style Kalender */
        .show-list {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .show-row {
            display: grid;
            grid-template-columns: 150px 1fr 250px 180px;
            border-top: 1px solid var(--black);
            padding: 25px 0;
            align-items: center;
            text-decoration: none;
            color: var(--black);
            transition: background-color 0.2s ease;
        }

        .show-row:hover {
            background-color: #f9f5f5;
        }

        .show-date {
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .show-title {
            font-size: 1.6rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .show-location {
            font-size: 1rem;
            color: #333;
        }

        .ticket-btn {
            display: inline-block;
            border: 1px solid var(--black);
            padding: 8px 16px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            text-align: center;
            background: none;
            color: var(--black);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ticket-btn:hover {
            background: var(--black);
            color: var(--white);
        }
        
        footer {
            margin-top: 100px;
            border-top: 1px solid var(--black);
            padding-top: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--gray);
            width: 100%;
        }

        @media (max-width: 768px) {
            body { padding: 20px; }
            header { flex-direction: column; align-items: flex-start; gap: 20px; }
            .logo-container { align-items: flex-start; }
            .brand-sub { text-align: left; }
            .show-row { grid-template-columns: 1fr; gap: 15px; padding: 20px 0; }
            h1.page-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <!-- HEADER ÜBER DIE KOMPLETTE STRUKTURBREITE -->
<header>
    <a href="index.html" class="logo-link">
        <img src="uploads/havoc-logo.jpeg" alt="HAVOC AGENCY">
    </a>
    <nav>
        <a href="index.html">START //</a>
        <a href="roster.html">ARTISTS //</a> <!-- Springt direkt zum Künstler-Grid auf der Startseite -->
        <a href="kalender.html">TOUR DATES //</a>
        <a href="shows.html">SHOWS //</a>
        <a href="team.html">TEAM //</a>
        <a href="stu.html">STU //</a>
        <a href="kontakt.html">CONTACT //</a>
        <a href="admin-dashboard.html" class="admin-btn">ADMIN</a>
    </nav>
</header>

    <!-- GEZENTRIERTER CONTENTBEREICH -->
    <div class="content-container">
        <main>
            <h1 class="page-title">AGENCY SHOWS //</h1>
            <div class="show-list" id="showsContainer">
                <p style="text-transform: uppercase; font-weight: 700;">Lade Shows...</p>
            </div>
        </main>

<footer style="margin-top: 100px; border-top: 1px solid #000000; padding-top: 20px; width: 100%; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
    <!-- Der Link ist jetzt elegant geschrumpft (0.7rem) und im gleichen Grau wie das Copyright -->
    <div style="margin-bottom: 8px;">
        <a href="impressum.html" target="_blank" class="footer-legal-link" style="font-size: 0.7rem; font-weight: 500; text-transform: uppercase; color: #757575; text-decoration: none; letter-spacing: 0.05em; transition: color 0.2s ease;" onmouseover="this.style.color='#000000'" onmouseout="this.style.color='#757575'">IMPRESSUM //</a>
    </div>
    <div style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #757575; letter-spacing: -0.01em;">
        © 2026 HAVOC AGENCY. ALL RIGHTS RESERVED.
    </div>
</footer>
    </div>

    <script>
        async function fetchAgencyShows() {
            try {
                const response = await fetch('https://havoc-backend-063h.onrender.com/api/agency-shows');
                const shows = await response.json();
                const container = document.getElementById('showsContainer');
                container.innerHTML = '';

                if (shows.length === 0) {
                    container.innerHTML = '<p style="text-transform: uppercase; font-weight: 700;">Aktuell keine exklusiven Shows geplant.</p>';
                    return;
                }

                shows.forEach(show => {
                    const rowHTML = `
                        <a href="show-detail.html?id=${show.id}" class="show-row">
                            <div class="show-date">${show.date}</div>
                            <div class="show-title">${show.title}</div>
                            <div class="show-location">${show.venue} // ${show.city}</div>
                            <div>
                                ${show.ticket_url ? `<div class="ticket-btn" onclick="event.preventDefault(); window.open('\${show.ticket_url}', '_blank')">TICKETS //</div>` : '—'}
                            </div>
                        </a>
                    `;
                    container.insertAdjacentHTML('beforeend', rowHTML);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('showsContainer').innerHTML = '<p style="text-transform: uppercase; font-weight: 700; color: red;">Fehler beim Laden.</p>';
            }
        }
        document.addEventListener('DOMContentLoaded', fetchAgencyShows);
    </script>
</body>
</html>
