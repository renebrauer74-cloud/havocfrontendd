<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAVOC AGENCY | TEAM</title>
    <style>
        /* ==========================================================================
           1:1 DESIGN SYSTEM NACH BRAND-VORGABE
           ========================================================================== */
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray: #757575;
            --font-main: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--white);
            color: var(--black);
            font-family: var(--font-main);
            padding: 40px; 
            letter-spacing: -0.02em;
        }

        /* --- HEADER ÜBER DIE KOMPLETTE BREITE --- */
 header {
    display: flex;
    justify-content: space-between;
    align-items: center; 
    border-bottom: 1px solid #e0e0e0; 
    padding-bottom: 20px;
    margin-bottom: 60px;
    width: 100%; 
}

.logo-link {
    display: inline-block;
    text-decoration: none;
    line-height: 0;
    transition: opacity 0.2s ease;
}

.logo-link:hover {
    opacity: 0.8;
}

.logo-link img {
    height: 98px; /* Exakt 50% vergrößert für den brachialen Look */
    width: auto;
    display: block;
}

nav {
    display: flex;
    align-items: center;
    gap: 25px;
}

nav a {
    color: #000000;
    text-decoration: none;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    transition: opacity 0.2s ease;
}

nav a:hover {
    opacity: 0.5;
}

nav a.active {
    opacity: 0.4; /* Kennzeichnet die aktuell aktive Seite */
}

nav a.admin-btn {
    border: 1px solid #000000;
    padding: 6px 12px;
    margin-left: 5px;
}

        /* Umrandeter ADMIN-Button am Ende der Leiste */
        nav a.admin-btn {
            border: 1px solid var(--black);
            padding: 6px 12px;
            font-weight: 700;
        }

        /* ==========================================================================
           ZENTRIERTER CONTENT WRAPPER (NUR FÜR DEN INHALT UNTERHALB DES HEADERS)
           ========================================================================== */
        .content-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- INHALTS-ELEMENTE --- */
        h1.page-title {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 60px;
            line-height: 0.9;
            width: 100%;
        }

        /* Dynamisches Team-Grid */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 60px 40px;
            width: 100%;
        }

        .team-card {
            border-top: 1px solid var(--black);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
        }

        .profile-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #f0f0f0;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.3s ease;
        }

        .team-card:hover .profile-img {
            filter: grayscale(0%);
        }

        .member-name {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 15px;
            line-height: 1.1;
        }

        .metadata-group {
            margin-bottom: 20px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .metadata-row {
            display: flex;
        }

        .metadata-label {
            font-weight: 700;
            text-transform: uppercase;
            width: 90px;
        }

        .metadata-value a {
            color: var(--black);
            text-decoration: none;
            border-bottom: 1px solid var(--black);
        }

        .member-bio {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--black);
            text-align: justify;
        }

        /* FOOTER ÜBER DIE VOLLE BREITE */
        footer {
            margin-top: 100px;
            border-top: 1px solid var(--black);
            padding-top: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--gray);
            width: 100%;
        }

        @media (max-width: 768px) {
            body { padding: 20px; }
            h1.page-title { font-size: 2.5rem; margin-bottom: 40px; }
            header { flex-direction: column; align-items: flex-start; gap: 20px; }
            .logo-container { align-items: flex-start; }
            .brand-sub { text-align: left; }
            .team-grid { grid-template-columns: 1fr; gap: 40px; }
        }
    </style>
</head>
<body>

    <!-- HEADER AN DEN ÄUSSEREN RÄNDERN DEINER WEBSEITE -->
   <!-- REPLIZIERTER HEADER MIT OFFIZIELLEM LOGO-BILD -->
<header>
    <a href="index.html" class="logo-link">
        <img src="uploads/havoc-logo.jpeg" alt="HAVOC AGENCY">
    </a>
    <nav>
        <a href="index.html">START //</a>
        <a href="roster.html">ARTISTS //</a> <!-- Springt direkt zum Künstler-Grid auf der Startseite -->
        <a href="kalender.html">TOUR DATES //</a>
        <a href="shows.html">SHOWS //</a>
        <a href="team.html">TEAM //</a>
        <a href="stu.html">STU //</a>
        <a href="kontakt.html">CONTACT //</a>
        <a href="admin-dashboard.html" class="admin-btn">ADMIN</a>
    </nav>
</header>

    <!-- HIER DRIN WIRD NUR DER INHALT SOUVERÄN GEZENTRIERT -->
    <div class="content-container">
        <main>
            <h1 class="page-title">OUR TEAM //</h1>
            
            <div class="team-grid" id="teamContainer">
                <div class="team-card">
                    <p style="font-weight:700; text-transform:uppercase;">Lade Teammitglieder aus der Datenbank...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- FOOTER ÜBER DIE VOLLE BREITE -->
<footer style="margin-top: 100px; border-top: 1px solid #000000; padding-top: 20px; width: 100%; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
    <!-- Der Link ist jetzt elegant geschrumpft (0.7rem) und im gleichen Grau wie das Copyright -->
    <div style="margin-bottom: 8px;">
        <a href="impressum.html" target="_blank" class="footer-legal-link" style="font-size: 0.7rem; font-weight: 500; text-transform: uppercase; color: #757575; text-decoration: none; letter-spacing: 0.05em; transition: color 0.2s ease;" onmouseover="this.style.color='#000000'" onmouseout="this.style.color='#757575'">IMPRESSUM //</a>
    </div>
    <div style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #757575; letter-spacing: -0.01em;">
        © 2026 HAVOC AGENCY. ALL RIGHTS RESERVED.
    </div>
</footer>

    <script>
        async function fetchTeam() {
            try {
                const response = await fetch('https://havoc-backend-063h.onrender.com/api/team');
                if (!response.ok) throw new Error('Fehler beim Laden des Teams');
                
                const teamMembers = await response.json();
                const container = document.getElementById('teamContainer');
                container.innerHTML = '';

                if (teamMembers.length === 0) {
                    container.innerHTML = '<p style="font-weight:700; text-transform:uppercase;">Keine Teammitglieder eingetragen.</p>';
                    return;
                }

                teamMembers.forEach(member => {
                    const imageSrc = member.image_url || 'data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23000"/><text x="50" y="55" font-family="Arial" font-size="12" fill="%23fff" text-anchor="middle">HAVOC</text></svg>';
                    const cleanBio = member.bio ? decodeURIComponent(escape(atob(member.bio))) : '';

                    const cardHTML = `
                        <div class="team-card">
                            <div class="profile-wrapper">
                                <img src="${imageSrc}" alt="${member.name}" class="profile-img">
                            </div>
                            <h2 class="member-name">${member.name}</h2>
                            
                            <div class="metadata-group">
                                <div class="metadata-row"><span class="metadata-label">FON //</span><span class="metadata-value">${member.phone || '—'}</span></div>
                                <div class="metadata-row"><span class="metadata-label">MAIL //</span><span class="metadata-value"><a href="mailto:${member.email}">${member.email}</a></span></div>
                                <div class="metadata-row"><span class="metadata-label">HOBBY //</span><span class="metadata-value">${member.hobbies || '—'}</span></div>
                            </div>
                            
                            <p class="member-bio">${cleanBio}</p>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });

            } catch (error) {
                console.error(error);
                document.getElementById('teamContainer').innerHTML = '<p style="font-weight:700; text-transform:uppercase; color:#ff0000; font-size:0.8rem;">FEHLER BEIM ABRUFEN DER TEAM-DATEN.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchTeam);
    </script>
</body>
</html>
