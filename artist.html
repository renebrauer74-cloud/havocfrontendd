<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAVOC AGENCY | Artist Profile</title>
    <style>
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::selection {
            background-color: #000000;
            color: #ffffff;
        }

header {
    display: flex;
    justify-content: space-between;
    align-items: center; 
    border-bottom: 1px solid #e0e0e0; 
    padding-bottom: 20px;
    margin-bottom: 60px;
    width: 100%; 
}

.logo-link {
    display: inline-block;
    text-decoration: none;
    line-height: 0;
    transition: opacity 0.2s ease;
}

.logo-link:hover {
    opacity: 0.8;
}

.logo-link img {
    height: 98px; /* Exakt 50% vergrößert für den brachialen Look */
    width: auto;
    display: block;
}

nav {
    display: flex;
    align-items: center;
    gap: 25px;
}

nav a {
    color: #000000;
    text-decoration: none;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    transition: opacity 0.2s ease;
}

nav a:hover {
    opacity: 0.5;
}

nav a.active {
    opacity: 0.4; /* Kennzeichnet die aktuell aktive Seite */
}

nav a.admin-btn {
    border: 1px solid #000000;
    padding: 6px 12px;
    margin-left: 5px;
}
        /* ARTIST HERO BANNER */
        .artist-hero {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px;
            border-left: 1px solid #000000;
            border-right: 1px solid #000000;
            border-bottom: 1px solid #000000;
        }

        .hero-image-container {
            width: 100%;
            aspect-ratio: 2 / 1;
            border: 1px solid #000000;
            overflow: hidden;
            background-color: #f4f4f5;
        }

        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .artist-header-box {
            padding: 40px 0 0 0;
        }

        .artist-main-name {
            font-weight: 900;
            font-size: clamp(36px, 6vw, 72px);
            text-transform: uppercase;
            letter-spacing: -0.04em;
            line-height: 0.9;
        }

        .artist-main-genre {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #71717a;
            margin-top: 12px;
        }

        /* CONTENT GRID: BIO & LINKS */
        .profile-grid {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            border-left: 1px solid #000000;
            border-right: 1px solid #000000;
        }

        @media (min-width: 768px) {
            .profile-grid {
                grid-template-columns: 2fr 1fr;
            }
        }
                .bio-box {
            padding: 40px 24px;
            border-bottom: 1px solid #000000;
            line-height: 1.6;
            font-size: 15px;
            color: #18181b;
        }

        .links-box {
            padding: 40px 24px;
            border-bottom: 1px solid #000000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .links-box {
                border-left: 1px solid #000000;
            }
        }

        /* REPARIERTE EDITORIAL BUTTONS */
        .media-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 14px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1px solid #000000;
            background-color: #000000;
            color: #ffffff;
        }

        .media-btn:hover { 
            background-color: #ffffff !important; 
            color: #000000 !important; 
        }

        /* 📸 LIVE-FOTO GALERIE GRID */
        .artist-gallery-section {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            border-left: 1px solid #000000;
            border-right: 1px solid #000000;
            border-bottom: 1px solid #000000;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 24px;
            background-color: #ffffff;
        }

        @media (min-width: 768px) {
            .gallery-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .gallery-item {
            width: 100%;
            aspect-ratio: 3 / 2;
            overflow: hidden;
            border: 1px solid #000000;
            background-color: #f4f4f5;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: all 0.4s ease;
        }

        .gallery-item:hover img {
            filter: grayscale(0%);
            transform: scale(1.02);
        }

        /* REPARIERTE TOURDATEN-ROWS (KEIN ÜBERLAPPEN MEHR) */
        .artist-shows {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            border-left: 1px solid #000000;
            border-right: 1px solid #000000;
            border-bottom: 1px solid #000000;
        }

        .section-title {
            font-weight: 900;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            padding: 24px;
            border-bottom: 1px solid #000000;
            background-color: #f4f4f5;
        }

        #artistShowsContainer {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .ticket-row {
            display: flex;
            flex-direction: column;
            padding: 24px;
            border-bottom: 1px solid #e4e4e7;
            background-color: #ffffff;
            width: 100%;
            gap: 12px;
        }
        .ticket-row:last-child { border-bottom: none; }

        @media (min-width: 768px) {
            .ticket-row {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 0;
            }
        }
        .ticket-row:hover { background-color: #f4f4f5; }

        .date-info { font-family: monospace; font-size: 15px; color: #52525b; min-width: 140px; }
        .show-info { font-weight: 900; font-size: 18px; text-transform: uppercase; margin: 0; flex-grow: 1; }
        @media (min-width: 768px) { .show-info { padding-left: 32px; padding-right: 32px; } }

        .ticket-btn {
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 24px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            text-align: center;
            border: 1px solid #000000;
            transition: all 0.2s ease;
            display: inline-block;
            width: 100%;
        }
        @media (min-width: 768px) { .ticket-btn { width: auto; } }
        .ticket-btn:hover { background-color: #ffffff; color: #000000; }

        footer {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            border-left: 1px solid #000000;
            border-right: 1px solid #000000;
            border-bottom: 1px solid #000000;
            padding: 40px 24px;
            text-align: center;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #71717a;
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo-link">
        <img src="uploads/havoc-logo.jpeg" alt="HAVOC AGENCY">
    </a>
    <nav>
        <a href="index.html">START //</a>
        <a href="index.html#artists">ARTISTS //</a> <!-- Springt direkt zum Künstler-Grid auf der Startseite -->
        <a href="kalender.html">TOUR DATES //</a>
        <a href="shows.html">SHOWS //</a>
        <a href="team.html">TEAM //</a>
        <a href="stu.html">STU //</a>
        <a href="kontakt.html">CONTACT //</a>
        <a href="admin-dashboard.html" class="admin-btn">ADMIN</a>
    </nav>
</header>

    <main>
        <section class="artist-hero">
            <div class="hero-image-container">
                <img id="artistImg" src="" alt="Band Image">
            </div>
            <div class="artist-header-box">
                <h1 id="artistName" class="artist-main-name">Lade Künstler...</h1>
                <div id="artistGenre" class="artist-main-genre"></div>
            </div>
        </section>

        <!-- BIO & LINKS MIT SPRACH-TOGGLE -->
        <section class="profile-grid">
            <div class="bio-box">
                <div style="display: flex; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid #e4e4e7; padding-bottom: 12px;">
                    <button id="btnLangDe" onclick="toggleLanguage('de')" style="background: #000000; color: #ffffff; border: 1px solid #000000; padding: 4px 10px; font-size: 10px; font-weight: 900; font-family: monospace; cursor: pointer; transition: all 0.2s ease;">DE</button>
                    <button id="btnLangEn" onclick="toggleLanguage('en')" style="background: none; color: #71717a; border: 1px solid #e4e4e7; padding: 4px 10px; font-size: 10px; font-weight: 900; font-family: monospace; cursor: pointer; transition: all 0.2s ease;">EN</button>
                </div>
                <div id="artistBio">Lade Biografie...</div>
            </div>
            
            <div class="links-box" id="artistLinks"></div>
        </section>

        <!-- 📸 DYNAMISCHE LIVE-GALERIE -->
        <section class="artist-gallery-section" id="gallerySection" style="display: none;">
            <div class="section-title">Live Gallery //</div>
            <div id="artistGalleryGrid" class="gallery-grid"></div>
        </section>

        <!-- UPCOMING SHOWS -->
        <section class="artist-shows">
            <div class="section-title">Upcoming Shows</div>
            <div id="artistShowsContainer">
                <div style="padding: 24px; color: #71717a; text-transform: uppercase; font-size: 12px;">Lade Live-Daten...</div>
            </div>
        </section>
    </main>

<footer style="margin-top: 100px; border-top: 1px solid #000000; padding-top: 20px; width: 100%; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
    <!-- Der Link ist jetzt elegant geschrumpft (0.7rem) und im gleichen Grau wie das Copyright -->
    <div style="margin-bottom: 8px;">
        <a href="impressum.html" target="_blank" class="footer-legal-link" style="font-size: 0.7rem; font-weight: 500; text-transform: uppercase; color: #757575; text-decoration: none; letter-spacing: 0.05em; transition: color 0.2s ease;" onmouseover="this.style.color='#000000'" onmouseout="this.style.color='#757575'">IMPRESSUM //</a>
    </div>
    <div style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #757575; letter-spacing: -0.01em;">
        © 2026 HAVOC AGENCY. ALL RIGHTS RESERVED.
    </div>
</footer>

    <script>
        let bioDe = '';
        let bioEn = '';

        // --- 1. PROFIL & DIENSTE AUS DER DATENBANK ABFRAGEN ---
        async function loadArtistProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            const artistId = urlParams.get('id');

            if (!artistId) {
                document.getElementById('artistName').textContent = 'Kein Künstler ausgewählt';
                return;
            }

            try {
                const response = await fetch('https://havoc-backend-063h.onrender.com/api/artists/' + artistId);
                const artist = await response.json();

                if (artist.error) {
                    document.getElementById('artistName').textContent = 'Künstler nicht gefunden';
                    return;
                }

                document.title = artist.name + ' | HAVOC AGENCY';
                document.getElementById('artistName').textContent = artist.name;
                document.getElementById('artistGenre').textContent = artist.genre || 'Alternative';

                const imgElement = document.getElementById('artistImg');
                if (imgElement && artist.image_url) {
                    imgElement.src = artist.image_url;
                }

                // Biografie-Texte zwischenspeichern
                bioDe = artist.bio ? artist.bio.replace(/\n/g, '<br>') : '<span style="color:#a1a1aa; font-style:italic;">Bislang ist noch kein Infotext für diese Band hinterlegt.</span>';
                bioEn = artist.bio_en ? artist.bio_en.replace(/\n/g, '<br>') : '<span style="color:#a1a1aa; font-style:italic;">No biography available for this artist yet.</span>';

                // Deutsche Version als Standard setzen
                toggleLanguage('de');

                // EDITORIAL SOZIAL-BUTTONS AUSGEBEN
                const linksContainer = document.getElementById('artistLinks');
                if (linksContainer) {
                    let linksHtml = '';
                    if (artist.website_url) linksHtml += `<a href="${artist.website_url}" target="_blank" class="media-btn">Official Website</a>`;
                    if (artist.spotify_url) linksHtml += `<a href="${artist.spotify_url}" target="_blank" class="media-btn">Listen on Spotify</a>`;
                    if (artist.youtube_url) linksHtml += `<a href="${artist.youtube_url}" target="_blank" class="media-btn">Watch on YouTube</a>`;
                    if (artist.instagram_url) linksHtml += `<a href="${artist.instagram_url}" target="_blank" class="media-btn">Instagram</a>`;
                    if (artist.tiktok_url) linksHtml += `<a href="${artist.tiktok_url}" target="_blank" class="media-btn">TikTok</a>`;
                    
                    if (linksHtml === '') {
                        linksHtml = '<div style="font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:#71717a;">Keine Links hinterlegt</div>';
                    }
                    linksContainer.innerHTML = linksHtml;
                }

                // 📸 LIVE-FOTOS AUSLESEN
                renderArtistLiveGallery(artist.gallery);

                // 📅 KOMMENDE TOUREN DIESER BAND AUSGEBEN
                const showsContainer = document.getElementById('artistShowsContainer');
                if (showsContainer) {
                    if (!artist.dates || artist.dates.length === 0) {
                        showsContainer.innerHTML = '<div style="padding: 24px; color: #71717a; text-transform: uppercase; font-size: 12px;">Aktuell keine kommenden Tourdaten für diese Band eingetragen.</div>';
                    } else {
                        showsContainer.innerHTML = artist.dates.map(show => `
                            <div class="ticket-row">
                                <div class="date-info">${show.date}</div>
                                <div class="show-info">${show.city} <span style="color: #a1a1aa; font-weight: 300;">//</span> ${show.venue}</div>
                                <a href="${show.link || '#'}" target="_blank" class="ticket-btn">Tickets</a>
                            </div>
                        `).join('');
                    }
                }

            } catch (err) {
                document.getElementById('artistName').textContent = 'Verbindungsfehler';
                console.error(err);
            }
        }

        // --- 2. 📸 GALERIE-BILDER INS RASTER EINSPEISEN (MAX. 8) ---
        function renderArtistLiveGallery(galleryImages) {
            const gallerySection = document.getElementById('gallerySection');
            const galleryGrid = document.getElementById('artistGalleryGrid');
            
            if (!galleryGrid || !gallerySection) return;

            if (!galleryImages || galleryImages.length === 0) {
                gallerySection.style.display = 'none';
                return;
            }

            galleryGrid.innerHTML = galleryImages.map(img => `
                <div class="gallery-item">
                    <img src="${img.gallery_url}" alt="Live Photo" onclick="window.open(this.src, '_blank')">
                </div>
            `).join('');

            gallerySection.style.display = 'block';
        }

        // --- 3. SPRACHSTEUERUNG (DE/EN) ---
        function toggleLanguage(lang) {
            const bioBox = document.getElementById('artistBio');
            const btnDe = document.getElementById('btnLangDe');
            const btnEn = document.getElementById('btnLangEn');

            if (!bioBox) return;

            if (lang === 'de') {
                bioBox.innerHTML = bioDe;
                if (btnDe && btnEn) {
                    btnDe.style.background = '#000000';
                    btnDe.style.color = '#ffffff';
                    btnDe.style.borderColor = '#000000';
                    btnEn.style.background = 'none';
                    btnEn.style.color = '#71717a';
                    btnEn.style.borderColor = '#e4e4e7';
                }
            } else {
                bioBox.innerHTML = bioEn;
                if (btnDe && btnEn) {
                    btnEn.style.background = '#000000';
                    btnEn.style.color = '#ffffff';
                    btnEn.style.borderColor = '#000000';
                    btnDe.style.background = 'none';
                    btnDe.style.color = '#71717a';
                    btnDe.style.borderColor = '#e4e4e7';
                }
            }
        }

        window.addEventListener('DOMContentLoaded', loadArtistProfile);
    </script>
</body>
</html>
