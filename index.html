<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAVOC AGENCY | Booking & Management</title>
    <style>
        @import url('https://googleapis.com');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::selection {
            background-color: #000000;
            color: #ffffff;
        }

header {
    display: flex;
    justify-content: space-between;
    align-items: center; 
    border-bottom: 1px solid #e0e0e0; 
    padding-bottom: 20px;
    margin-bottom: 60px;
    width: 100%; 
}

.logo-link {
    display: inline-block;
    text-decoration: none;
    line-height: 0;
    transition: opacity 0.2s ease;
}

.logo-link:hover {
    opacity: 0.8;
}

.logo-link img {
    height: 98px; /* Exakt 50% vergrößert für den brachialen Look */
    width: auto;
    display: block;
}

nav {
    display: flex;
    align-items: center;
    gap: 25px;
}

nav a {
    color: #000000;
    text-decoration: none;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    transition: opacity 0.2s ease;
}

nav a:hover {
    opacity: 0.5;
}

nav a.active {
    opacity: 0.4; /* Kennzeichnet die aktuell aktive Seite */
}

nav a.admin-btn {
    border: 1px solid #000000;
    padding: 6px 12px;
    margin-left: 5px;
}

        .admin-link {
            border: 1px solid #000000;
            padding: 6px 12px;
            color: #000000;
        }

        .admin-link:hover {
            background-color: #000000;
            color: #ffffff;
        }

        .hero {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 120px 24px;
            border-bottom: 1px solid #000000;
        }

        .hero h1 {
            font-weight: 900;
            font-size: clamp(48px, 8vw, 96px);
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -0.04em;
        }

        .hero h1 span {
            color: #a1a1aa;
        }

        .hero p {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #52525b;
            margin-top: 24px;
            font-weight: 300;
        }

        .roster-section {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            border-left: 1px solid #000000;
            border-right: 1px solid #000000;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
        }

        @media (min-width: 768px) {
            .grid-container {
                grid-template-cols: repeat(3, 1fr);
            }
        }

        .artist-card {
            border-bottom: 1px solid #000000;
            padding: 24px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .artist-card:not(:nth-child(3n+1)) {
                border-left: 1px solid #000000;
            }
        }

        .artist-card:hover {
            background-color: #f4f4f5;
        }

          .image-wrapper {
            width: 100%;
            /* NEU: Ein flaches Querformat (Breite zu Höhe wie 2 zu 1) halbiert die Höhe */
            aspect-ratio: 2 / 1; 
            background-color: #e4e4e7;
            margin-bottom: 20px;
            overflow: hidden;
            filter: grayscale(100%);
            transition: all 0.5s ease;
            border: 1px solid #000000;
        }


        .artist-card:hover .image-wrapper {
            filter: grayscale(0%);
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            image-rendering: -webkit-optimize-contrast;
            backface-visibility: hidden;
        }

        .artist-card:hover .image-wrapper img {
            transform: scale(1.03);
        }

        .no-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a1a1aa;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 0.1em;
            background-color: #f4f4f5;
        }

        .artist-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: auto;
        }

        .artist-name {
            font-weight: 900;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .artist-genre {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #71717a;
            margin-top: 4px;
        }

        .ticket-row {
            display: flex;
            flex-direction: column;
            padding: 20px 24px;
            border-bottom: 1px solid #000000;
            transition: background-color 0.2s ease;
        }

        @media (min-width: 768px) {
            .ticket-row {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        .ticket-row:hover {
            background-color: #f4f4f5;
        }

        .date-info {
            font-family: monospace;
            font-size: 14px;
            color: #52525b;
            min-width: 120px;
        }

        .show-info {
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            margin: 8px 0;
        }

        @media (min-width: 768px) {
            .show-info {
                margin: 0;
                flex-grow: 1;
                padding-left: 24px;
            }
        }

        .ticket-btn {
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-align: center;
            transition: background-color 0.2s ease;
            border: 1px solid #000000;
        }

        .ticket-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

        footer {
            margin-top: auto;
            border-top: 1px solid #000000;
            padding: 40px 24px;
            text-align: center;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #71717a;
        }

                /* --- FULL-WIDTH BAND CAROUSEL --- */
.carousel-section {
            width: 100%;
            overflow: hidden; /* Versteckt die Scrollbar komplett */
            background-color: #ffffff;
            border-bottom: 1px solid #000000;
            position: relative;
        }

        .carousel-track {
            display: flex;
            width: max-content;
            /* Aktiviert den automatischen Fluss von rechts nach links (Dauer: 25 Sekunden) */
            animation: marqueeLoop 150s linear infinite;
        }

        /* Pausiert den Fluss seidenweich, sobald die Maus auf der Leiste steht */
        .carousel-section:hover .carousel-track {
            animation-play-state: paused;
        }

        .carousel-item {
            position: relative;
            width: clamp(350px, 35vw, 550px); /* Wuchtiges, breites Kino-Format */
            aspect-ratio: 16 / 10;
            border-right: 1px solid #000000;
            overflow: hidden;
            background-color: #f4f4f5;
            cursor: pointer;
            flex-shrink: 0;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        /* INFOS AUF DEM BILD (BANDNAME & GENRE) */
        .carousel-meta {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 24px;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transform: translateY(10px);
            opacity: 0;
            transition: all 0.4s ease;
        }

        .carousel-item:hover img { filter: grayscale(0%); transform: scale(1.02); }
        .carousel-item:hover .carousel-meta { transform: translateY(0); opacity: 1; }

        .carousel-band-name { font-weight: 900; font-size: 22px; text-transform: uppercase; letter-spacing: -0.02em; }
        .carousel-band-genre { font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: #a1a1aa; }

        /* 🔥 DER MATHEMATISCHE GEHEIMTRICK FÜR DIE ENDLOSSCHLEIFE */
        @keyframes marqueeLoop {
            0% {
                transform: translate3d(0, 0, 0);
            }
            100% {
                /* Schiebt exakt die erste Hälfte (50%) durch. Da die zweite Hälfte 
                   identisch ist, springt der Loop unmerklich und ruckelfrei auf 0% zurück! */
                transform: translate3d(-50%, 0, 0);
            }
        }

           /* --- MODERN EDITORIAL NEWS STYLES --- */
        .news-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 32px;
            width: 100%;
        }
        @media (min-width: 768px) {
            .news-container { grid-template-columns: repeat(2, 1fr); }
        }
        .news-card {
            border: 1px solid #000000;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }
        .news-img-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-bottom: 1px solid #000000;
            overflow: hidden;
            background-color: #f4f4f5;
        }
        .news-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .news-content { padding: 24px; display: flex; flex-direction: column; }
        .news-date { font-family: monospace; font-size: 11px; color: #71717a; margin-bottom: 8px; }
        .news-title { font-weight: 900; font-size: 22px; text-transform: uppercase; letter-spacing: -0.02em; margin-bottom: 12px; }
        .news-text { font-size: 14px; line-height: 1.6; color: #27272a; }

        /* ARCHIV-ZEILEN FÜR ÄLTERE NEWS */
        .archive-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #e4e4e7; cursor: pointer; }
        .archive-title { font-weight: 900; text-transform: uppercase; font-size: 14px; }
        .archive-date { font-family: monospace; font-size: 12px; color: #a1a1aa; }
        .archive-body { display: none; padding: 16px; background-color: #f4f4f5; border-left: 2px solid #000000; margin-bottom: 8px; font-size: 13px; line-height: 1.5; }

                /* --- DESIGN-SCHLIFF FÜR DEN INDEX-KALENDER --- */
        .homepage-artist-name {
            font-weight: 900;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: -0.01em;
            background-color: #f4f4f5;
            padding: 2px 8px;
            border: 1px solid #000000;
            font-size: 11px;
            display: inline-block;
            margin-top: 4px;
        }
        @media (min-width: 768px) {
            .homepage-artist-name { margin-top: 0; margin-left: 12px; }
        }

        /* PECHSCHWARZER EDITORIAL MORE-BUTTON */
        .more-calendar-btn {
            display: block;
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            padding: 16px;
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .more-calendar-btn:hover {
            background-color: #ffffff;
            color: #000000;
        }

    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo-link">
        <img src="uploads/havoc-logo.jpeg" alt="HAVOC AGENCY">
    </a>
    <nav>
        <a href="index.html">START //</a>
        <a href="roster.html">ARTISTS //</a> <!-- Springt direkt zum Künstler-Grid auf der Startseite -->
        <a href="kalender.html">TOUR DATES //</a>
        <a href="shows.html">SHOWS //</a>
        <a href="team.html">TEAM //</a>
        <a href="stu.html">STU //</a>
        <a href="kontakt.html">CONTACT //</a>
        <a href="admin-dashboard.html" class="admin-btn">ADMIN</a>
    </nav>
</header>

    <!-- DYNAMISCHES FULL-WIDTH BAND KARUSSELL -->
    <section class="carousel-section">
        <div class="carousel-track" id="homepageCarouselTrack">
            <!-- Die Bands aus dem Dashboard werden hier live reingeladen -->
            <div style="padding: 40px; color: #71717a; text-transform: uppercase; font-size: 12px; letter-spacing: 0.1em;">Lade HAVOC Roster...</div>
        </div>
    </section>

    <main>
        <section class="hero">
            <h1>WE WREAK<br><span>HAVOC.</span></h1>
            <p>Artist Booking & Management Agency</p>
        </section>

                <!-- BRANDNEU: EDITORIAL NEWS GRID (ERSETZT DAS ALTE RIESENBILD) -->
        <section id="news" class="roster-section" style="margin-top: 40px; margin-bottom: 40px; padding: 24px; border-bottom: 1px solid #000000;">
            <div style="font-weight: 900; font-size: 32px; text-transform: uppercase; letter-spacing: -0.04em; margin-bottom: 32px;">Latest Updates //</div>
            
            <div class="news-container" id="latestNewsGrid">
                <!-- Hier lädt das JavaScript vollautomatisch deine Top 2 News aus dem Dashboard rein -->
            </div>

            <!-- DAS AUSKLAPPBARE ARCHIV FÜR ÄLTERE NEWS -->
            <div class="archive-section" id="archiveSection" style="display: none; margin-top: 40px; border-top: 1px solid #000000; padding-top: 24px;">
                <div style="font-weight: 900; font-size: 18px; text-transform: uppercase; letter-spacing: 0.1em; color: #71717a; margin-bottom: 16px;">Previous News</div>
                <div id="archiveNewsContainer"></div>
            </div>
        </section>

      <!-- RETUSCHIERT: HOCHLEGBARER KOMPAKTER TOUR-KALENDER (OHNE KONTAKTFORMULAR) -->
        <section id="dates" class="roster-section" style="margin-top: 60px; margin-bottom: 120px;">
            <h2 style="font-weight: 900; font-size: 32px; text-transform: uppercase; letter-spacing: -0.02em; padding: 24px; border-bottom: 1px solid #000000;">
                Upcoming Live Shows //
            </h2>
            
            <!-- Hier lädt das JavaScript gleich exakt die nächsten 4 Shows rein -->
            <div id="ticketContainer"></div>

            <!-- DER STRATEGISCHE "MORE"-BUTTON ZUM ZENTRALKALENDER -->
            <div style="padding: 24px; background-color: #ffffff;">
                <button class="more-calendar-btn" onclick="window.location.href='kalender.html'">
                    SHOW ALL DATES //
                </button>
            </div>
        </section>
    </main>

<footer style="margin-top: 100px; border-top: 1px solid #000000; padding-top: 20px; width: 100%; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
    <!-- Der Link ist jetzt elegant geschrumpft (0.7rem) und im gleichen Grau wie das Copyright -->
    <div style="margin-bottom: 8px;">
        <a href="impressum.html" target="_blank" class="footer-legal-link" style="font-size: 0.7rem; font-weight: 500; text-transform: uppercase; color: #757575; text-decoration: none; letter-spacing: 0.05em; transition: color 0.2s ease;" onmouseover="this.style.color='#000000'" onmouseout="this.style.color='#757575'">IMPRESSUM //</a>
    </div>
    <div style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #757575; letter-spacing: -0.01em;">
        © 2026 HAVOC AGENCY. ALL RIGHTS RESERVED.
    </div>
</footer>
        <script>
                    window.addEventListener('DOMContentLoaded', async () => {
                        loadHomepageCarousel();
                    });

        // --- 1. DAS UNENDLICHE BILDER-KARUSSELL (MARQUEE LOOP - ENTSCHLEUNIGT) ---
        async function loadHomepageCarousel() {
            const track = document.getElementById('homepageCarouselTrack');
            if (!track) return;
            try {
                const response = await fetch('https://havoc-backend-063h.onrender.com/api/artists');
                const artists = await response.json();
                if (!artists || artists.length === 0) {
                    track.innerHTML = '<div style="padding: 40px; color: #71717a; text-transform: uppercase; font-size: 11px; letter-spacing: 0.15em;">Aktuell keine Bands im Roster hinterlegt.</div>';
                    return;
                }
                function buildItemsHTML(list) {
                    let html = '';
                    
                    // Unzerstörbare URL-Basis gegen automatische Zensur-Kürzungen
                    const API_BASE = "https://havoc-backend-063h.onrender.com";
                    
                    for (let i = 0; i < list.length; i++) {
                        const artist = list[i];
                        let imgUrl = 'uploads/havoc-logo.jpeg'; // Standard-Fallback
                        
                        if (artist.image_url && artist.image_url.trim() !== '') {
                           
                                // Setzt den Dateinamen perfekt mit dem Upload-Ordner zusammen
                                imgUrl = artist.image_url;
                            
                        }
                        
                        html += `<div class="carousel-item" onclick="window.location.href='artist.html?id=${artist.id}'">`;
                        html += `  <img src="${imgUrl}" alt="${artist.name}" style="width:100%; height:100%; object-fit:cover;">`;
                        html += `  <div class="carousel-meta">`;
                        html += `    <div class="carousel-band-name">${artist.name}</div>`;
                        html += `    <div class="carousel-band-genre">${artist.genre || 'Alternative'}</div>`;
                        html += `  </div>`;
                        html += `</div>`;
                    }
                    return html;
                }

                const roundHtml = buildItemsHTML(artists);
                track.innerHTML = roundHtml + roundHtml;
            } catch (err) {
                track.innerHTML = '<div style="padding: 40px; color: #ef4444; font-family: monospace; font-size: 11px;">ROSTER-VERBINDUNGSFEHLER</div>';
            }
        }

        // --- 2. EDITORIAL NEWS SYSTEM (TOP 2 + ARCHIV-WEICHE) ---
        async function loadHomepageNews() {
            const grid = document.getElementById('latestNewsGrid');
            const archiveSection = document.getElementById('archiveSection');
            const archiveContainer = document.getElementById('archiveNewsContainer');
            if (!grid) return;

            try {
                const response = await fetch('https://havoc-backend-063h.onrender.com/api/news');
                const newsList = await response.json();

                if (!newsList || newsList.length === 0) {
                    grid.innerHTML = '<div style="color:#71717a; text-transform:uppercase; font-size:12px;">Aktuell keine Ankündigungen vorhanden.</div>';
                    if (archiveSection) archiveSection.style.display = 'none';
                    return;
                }

                let latestHtml = '';
                const limit = Math.min(newsList.length, 2);
                for (let i = 0; i < limit; i++) {
                    const n = newsList[i];
                    const dateStr = new Date(n.created_at).toLocaleDateString('de-DE');
                    const imgHtml = n.image_url ? `<img src="${n.image_url}">` : '<div style="width:100%; height:100%; background:#f4f4f5; display:flex; align-items:center; justify-content:center; color:#a1a1aa; font-weight:900;">HAVOC NEWS</div>';
                    
                    latestHtml += `
                        <div class="news-card">
                            <div class="news-img-box">${imgHtml}</div>
                            <div class="news-content">
                                <div class="news-date">${dateStr}</div>
                                <div class="news-title">${n.title}</div>
                                <div class="news-text">${n.text.replace(/\n/g, '<br>')}</div>
                            </div>
                        </div>
                    `;
                }
                grid.innerHTML = latestHtml;

                if (newsList.length > 2) {
                    let archiveHtml = '';
                    for (let i = 2; i < newsList.length; i++) {
                        const n = newsList[i];
                        const dateStr = new Date(n.created_at).toLocaleDateString('de-DE');
                        archiveHtml += `
                            <div class="archive-row" onclick="toggleArchiveRow(this)">
                                <div class="archive-title">${n.title}</div>
                                <div class="archive-date">${dateStr}</div>
                            </div>
                            <div class="archive-body">${n.text.replace(/\n/g, '<br>')}</div>
                        `;
                    }
                    if (archiveContainer) archiveContainer.innerHTML = archiveHtml;
                    if (archiveSection) archiveSection.style.display = 'block';
                } else {
                    if (archiveSection) archiveSection.style.display = 'none';
                }
            } catch (err) {
                grid.innerHTML = '<div style="color:#ef4444; font-family:monospace; font-size:12px;">Fehler beim Laden der News.</div>';
            }
        }

        window.toggleArchiveRow = function(element) {
            const body = element.nextElementSibling;
            if (body && body.classList.contains('archive-body')) {
                const isVisible = body.style.display === 'block';
                body.style.display = isVisible ? 'none' : 'block';
            }
        };

        // --- 3. KOMPAKTER LIVE-KALENDER (STARR GEKAPPT AUF MAX. 4 SHOWS) ---
        async function loadDates() {
            const container = document.getElementById('ticketContainer');
            if (!container) return;
            try {
                const response = await fetch('https://havoc-backend-063h.onrender.com/api/dates-all');
                const dates = await response.json();
                if (!dates || dates.length === 0) {
                    container.innerHTML = '<div style="padding: 24px; color:#a1a1aa; text-transform:uppercase; font-size:12px; letter-spacing:0.1em; padding-left: 24px;">Keine aktuellen Tourdaten vorhanden.</div>';
                    return;
                }
                
                // Wir nehmen exakt die ersten 4 chronologischen Termine
                const limitedDates = dates.slice(0, 4);
                
                container.innerHTML = limitedDates.map(show => `
                    <div class="ticket-row">
                        <div class="date-info">${show.date}</div>
                        <div class="show-info">
                            ${show.city} <span style="color: #a1a1aa; font-weight: 300;">//</span> ${show.venue}
                            <span class="homepage-artist-name">${show.artist_name}</span>
                        </div>
                        <a href="${show.link || '#'}" target="_blank" class="ticket-btn">Tickets</a>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<div style="padding:24px; color:#ef4444; font-family:monospace; font-size:12px;">Fehler beim Laden der Tourdaten.</div>';
            }
        }

          // --- LIVE-DATEN VON RENDER IN DAS KARUSSELL SPEISEN ---
        window.addEventListener('DOMContentLoaded', async () => {
            const carouselTrack = document.getElementById('carouselTrack');
            if (!carouselTrack) return;

            const API_BASE = "https://havoc-backend-063h.onrender.com";

            try {
                // Schießt die Anfrage direkt an deine funktionierende Schnittstelle
                const response = await fetch(API_BASE + '/api/artists');
                const artists = await response.json();

                if (artists && artists.length > 0) {
                    carouselTrack.innerHTML = buildItemsHTML(artists);
                    if (typeof initCarousel === 'function') {
                        initCarousel();
                    }
                } else {
                    carouselTrack.innerHTML = '<div style="font-size:11px; color:#757575; text-transform:uppercase; padding:20px;">NO ARTISTS IN ROSTER YET //</div>';
                }
            } catch (err) {
                console.error("Fehler beim Laden des Rosters:", err);
                carouselTrack.innerHTML = '<div style="font-size:11px; color:#ef4444; text-transform:uppercase; padding:20px;">DATABASE CONNECTION ERROR //</div>';
            }
        });
    </script>
</body>
</html>
